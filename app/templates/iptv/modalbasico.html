<!-- ========================================================= -->
<!-- MODAL DE PRECIOS PARA CLIENTES CON PANEL (IPTV BÁSICO)    -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-precios-basico" style="display: none;">
    <div class="modal-content modal-cristal">
        <div class="modal-header-row">
            <h2><i class="fas fa-star" style="color: var(--vip);"></i> Precios Básico</h2>
            <button type="button" class="btn-cerrar-modal" onclick="cerrarModalBasico()"><i class="fas fa-times"></i></button>
        </div>
        <p>Tarifas de recarga exclusivas para socios con panel básico:</p>
        
        <!-- Campo para usuario -->
        <div style="margin: 15px 0 8px 0;">
            <label style="color: #e5c158; font-size: 0.85rem; display: block; margin-bottom: 6px; font-weight: 600;">
                <i class="fas fa-user-circle"></i> Ingresa tu usuario de panel:
            </label>
            <input type="text" id="input-usuario-basico" placeholder="Ej: tu_usuario_basico" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid rgba(229,193,88,0.4); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none;">
        </div>

        <!-- Alerta oculta -->
        <div id="alerta-usuario-basico" style="display: none; background: rgba(255, 75, 43, 0.15); border: 1px solid #ff4b2b; color: #ff8b7c; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; align-items: center; gap: 8px;">
            <i class="fas fa-exclamation-triangle" style="font-size: 1rem;"></i>
            <span>Por favor, ingresa tu usuario antes de solicitar.</span>
        </div>

        <div class="modal-body-scroll">
            
            <!-- Opción 1 - Básico (Puedes cambiar los precios aquí) -->
            <div class="carrito-item-modal carrito-item-premium" style="display: flex; flex-direction: column; gap: 8px;">
                <div class="ci-title-row" style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
                    <h4>10 Créditos (Básico)</h4>
                    <span class="carrito-item-precio">S/ 25</span>
                </div>
                <button type="button" class="btn-wsp-recarga" onclick="enviarRecargaWhatsAppBasico('10 Créditos Básico (S/ 25)')">
                    <i class="fab fa-whatsapp"></i> Solicitar Recarga
                </button>
            </div>

            <!-- Puedes añadir más opciones básicas aquí abajo copiando el bloque anterior -->

        </div>

        <button type="button" class="btn-modal-back" onclick="cerrarModalBasico()" style="margin-top: 15px;">CERRAR</button>
    </div>
</div>
