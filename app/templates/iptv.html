{% extends "base.html" %}


{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/iptv.css') }}">

<header>
    <img src="{{ url_for('static', filename='img/logo.webp') }}" class="brand-logo">
    <h1 style="background: linear-gradient(45deg, #ff4b2b, #ff416c); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PANELES IPTV</h1>
    <p style="color: #ccc; font-size: 0.9rem; margin-top: 5px;">Televisión digital de alta calidad</p>


</header>
<div class="search-container-wrapper">
    <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Buscar servicio al por mayor..." onkeyup="filtrarPlataformas()">
    </div>

    <div class="filter-wrapper">
        <div class="scroll-indicator" onclick="scrollFilters(-200)"><i class="fas fa-chevron-left"></i></div>
        <div class="filter-container" id="filterScroll">
            <button class="btn-nav active" onclick="filtrarCategoria('TODOS', this)">TODOS</button>
            <button class="btn-nav" onclick="filtrarCategoria('PLANES IPTV STANDAR', this)"> IPTV STANDAR</button>
            <button class="btn-nav" onclick="filtrarCategoria('PLANES IPTV BASICO', this)"> IPTV BASICO</button>
            <button class="btn-nav" onclick="filtrarCategoria('HERRAMIENTAS', this)">HERRAMIENTAS</button>
        </div>
        <div class="scroll-indicator" onclick="scrollFilters(200)"><i class="fas fa-chevron-right"></i></div>
    </div>

    <div class="view-controls">
        <button class="btn-view active" onclick="cambiarVista('lista', this)" title="Vista Lista"><i class="fas fa-list"></i></button>
        <button class="btn-view" onclick="cambiarVista('grid', this)" title="Vista Cuadrícula"><i class="fas fa-th-large"></i></button>
    </div>
</div>

<div class="container" style="padding-top: 0;">
    <div class="grid-botones">
        <a href="{{ url_for('distribuidores.distribuidores') }}" onclick="window.history.back()" class="btn-universal" style="background:rgba(255,255,255,0.1); color:#fff;"><i class="fas fa-arrow-left" style="margin-right: 5px;"></i> VOLVER ATRÁS</a>
        <a href="{{ url_for('main.inicio') }}" class="btn-universal" style="background:var(--glass); color:#fff; border:1px solid var(--glass-border);"><i class="fas fa-home" style="margin-right: 5px;"></i> INICIO DEL PANEL</a>
    </div>
</div>
    
<div class="container" id="product-container">
{% include 'iptv/tarjetasstandar.html' %}
{% include 'iptv/tarjetasbasica.html' %}
</div>

<script src="{{ url_for('static', filename='js/iptv.js') }}"></script>
<script src="{{ url_for('static', filename='js/iptvbasico.js') }}"></script>
{% endblock %}
