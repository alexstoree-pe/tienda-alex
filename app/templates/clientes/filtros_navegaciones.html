<!-- Buscador y Filtros -->
<div class="search-container-wrapper">
    <div class="search-container">
        <!-- Buscador con evento onkeyup -->
        <input type="text" id="search-input" placeholder="Buscar plataforma..." autocomplete="off" onkeyup="filtrarPlataformas()">
        <i class="fas fa-search"></i>
        
        <div class="filter-wrapper">
            <!-- Flecha Izquierda -->
            <div class="scroll-indicator" onclick="scrollFilters(-100)"><i class="fas fa-chevron-left"></i></div>
            
            <!-- Botones de Filtro con onclick -->
            <div class="filter-container" id="filterScroll">
                <button class="btn-nav active" onclick="filtrarCategoria('TODOS', this)">TODOS</button>
                <button class="btn-nav" onclick="filtrarCategoria('STREAMING Y CINE', this)"><i class="fas fa-trophy"></i> PERFILES</button>
                <button class="btn-nav" onclick="filtrarCategoria('DISEÑOS Y MAS', this)">DISEÑO</button>
                <button class="btn-nav" onclick="filtrarCategoria('TELEVISIÓN DIGITAL', this)">TV DIGITAL</button>
                <button class="btn-nav" onclick="filtrarCategoria('IPTV Y FLUJO TV', this)">IPTV</button>
                <button class="btn-nav" onclick="filtrarCategoria('APPS PARA IPTV', this)">APPS</button>
                <button class="btn-nav" onclick="filtrarCategoria('MÚSICA Y VIDEO', this)">MÚSICA</button>
            </div>
            
            <!-- Flecha Derecha -->
            <div class="scroll-indicator" onclick="scrollFilters(100)"><i class="fas fa-chevron-right"></i></div>
        </div>
        
        <!-- Botones de Vista Cuadrícula/Lista -->
        <div class="view-controls">

            <button class="btn-accion-extra" id="btn-list" onclick="abrirModalInfo()" style="display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600;">
              <i class="fas fa-info-circle" style="color: var(--primary);"></i> INFO</button>
            <button class="btn-view active" id="btn-list" onclick="cambiarVista('lista', this)"><i class="fas fa-list"></i></button>
            <button class="btn-view" id="btn-grid" onclick="cambiarVista('cuadricula', this)"><i class="fas fa-th-large"></i></button>
            <button class="btn-accion-extra" onclick="abrirModalFaq()" title="Preguntas Frecuentes" style="display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600;">
              <i class="fas fa-question-circle" style="color: var(--primary);"></i> FAQ</button>
        </div>
    </div>
</div>
